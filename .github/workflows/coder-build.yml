# Generated by Neribo Vault Coder. You can edit this file.
name: Coder build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: coder-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
