<!doctype html>
<html lang="en" data-theme="dark" data-font-size="Default">
  <head>
    <script>
      // Apply the saved Color Mode / Font Size before first paint so
      // switching themes doesn't cause a flash of the previous theme on
      // reload. Mirrors the persistence logic in src/App.tsx.
      (function () {
        try {
          var raw = localStorage.getItem("neribo:settings");
          var saved = raw ? JSON.parse(raw) : null;
          var mode = (saved && saved.colorMode) || "Dark";
          var resolved =
            mode === "System"
              ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                  ? "light"
                  : "dark")
              : mode.toLowerCase();
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.setAttribute(
            "data-font-size",
            (saved && saved.fontSize) || "Default"
          );
        } catch (e) {
          // localStorage unavailable or corrupt saved settings — fall back
          // to the defaults already set on the html tag above.
        }
      })();
    </script>
